<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart — Custom Leather Apron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=1795535095">
<script src="assets/site.js?v=1795535095" defer></script>
</head>
<body data-page="cart">
<div id="site-header"></div>
<main class="wrap" style="max-width:1100px;padding-top:56px;padding-bottom:104px">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-bottom:32px">
    <h1 style="font-size:40px">Your Cart (<span id="c-count">0</span> Items)</h1>
    <a href="shop.html" style="color:var(--ink);text-decoration:none;font-weight:500">← Continue Shopping</a>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
    <section style="flex:999 1 560px;min-width:0;border-top:1px solid var(--line)" id="c-items" aria-live="polite"></section>
    <aside class="summary">
      <div class="serif" style="font-weight:600;font-size:22px">Order Summary</div>
      <div class="row"><span>Subtotal</span><b id="c-sub">$0.00</b></div>
      <div class="row"><span>Shipping</span><b id="c-ship">Free</b></div>
      <div style="font-size:13px;color:var(--muted)">Free shipping on orders over $99.</div>
      <div style="height:1px;background:var(--line)"></div>
      <div class="row serif" style="font-weight:700;font-size:24px"><span>Total</span><span id="c-total">$0.00</span></div>
      <button type="button" id="c-checkout" class="btn btn-primary">Proceed to Checkout →</button>
      <p id="c-note" class="hidden" style="margin:0;font-size:14px;color:var(--muted)">Checkout isn't connected yet — this is a design preview. Connect Shopify, Stripe or WooCommerce to take payments.</p>
    </aside>
  </div>
</main>
<div id="site-footer"></div>
</body>
</html>
