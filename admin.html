<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | Custom Leather Apron</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css?v=1795705890">
<script src="assets/config.js?v=1795705890" defer></script>
<script src="assets/db.js?v=1795705890" defer></script>
<script src="assets/site.js?v=1795705890" defer></script>
<script src="assets/admin.js?v=1795705890" defer></script>
</head>
<body data-page="admin">

<!-- Login -->
<section id="login" class="login hidden">
  <form id="login-form" class="login-card">
    <img src="assets/img/logo-dark.webp" alt="Custom Leather Apron" class="login-logo">
    <h1>Admin sign in</h1>
    <p>Orders, messages and customers for your store.</p>
    <label>Email<input id="lg-email" type="email" autocomplete="username" required></label>
    <label>Password<input id="lg-pass" type="password" autocomplete="current-password" required></label>
    <p id="lg-err" class="err hidden" role="alert"></p>
    <button type="submit" class="btn primary wide">Sign in</button>
    <a href="index.html" class="muted-link">← Back to website</a>
  </form>
</section>

<!-- App -->
<div id="app" class="app hidden">
  <aside class="side" id="side">
    <a href="admin.html" class="side-logo"><img src="assets/img/logo-light.webp" alt="Custom Leather Apron"></a>
    <nav class="side-nav" aria-label="Dashboard">
      <button type="button" data-view="overview" class="on"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Overview</button>
      <button type="button" data-view="orders"><svg viewBox="0 0 24 24"><path d="M6 2l-2 4v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6l-2-4zM4 6h16M16 10a4 4 0 0 1-8 0"/></svg>Orders<span class="pill" id="nb-orders"></span></button>
      <button type="button" data-view="messages"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages<span class="pill" id="nb-messages"></span></button>
      <button type="button" data-view="subscribers"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Subscribers</button>
      <button type="button" data-view="products"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8zM7 7h.01"/></svg>Products</button>
      <button type="button" data-view="setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Setup</button>
    </nav>
    <div class="side-foot">
      <span id="who" class="who"></span>
      <a href="index.html" target="_blank" rel="noopener">View website ↗</a>
      <button type="button" id="logout" class="linkish">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="view-title">Overview</h1>
      <div class="top-actions">
        <span id="mode" class="mode"></span>
        <button type="button" id="refresh" class="btn ghost"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>Refresh</button>
      </div>
    </header>
    <div id="demo-bar" class="demo-bar hidden">
      <b>Demo mode.</b> The database isn't connected yet, so this dashboard shows orders, messages and signups made <u>in this browser only</u>.
      <button type="button" id="seed" class="linkish">Load sample data</button> · <button type="button" id="clear-demo" class="linkish">Clear demo data</button> · <button type="button" data-goto="setup" class="linkish">Connect database →</button>
    </div>
    <div id="view" class="view" aria-live="polite"></div>
  </main>
</div>

<!-- Drawer -->
<div id="drawer-bg" class="drawer-bg hidden"></div>
<aside id="drawer" class="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dr-title">
  <header><h2 id="dr-title"></h2><button type="button" id="dr-close" aria-label="Close">×</button></header>
  <div id="dr-body" class="dr-body"></div>
</aside>
<div id="toast" class="toast" role="status"></div>
</body>
</html>
